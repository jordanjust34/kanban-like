name: Database

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/lib/database.types.ts'
      - 'scripts/rls-check.ts'
      - 'scripts/check-db-types.sh'
      - '.github/workflows/db.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/lib/database.types.ts'
      - 'scripts/rls-check.ts'
      - 'scripts/check-db-types.sh'
      - '.github/workflows/db.yml'
  workflow_dispatch:

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db:
    name: 'Database: types in sync, lint, RLS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Start local Supabase (db, auth, rest, kong, meta)
        run: >-
          supabase start
          -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,supavisor
      - name: Types in sync
        run: |
          supabase gen types typescript --schema public > "$RUNNER_TEMP/db.types.ts"
          scripts/check-db-types.sh "$RUNNER_TEMP/db.types.ts"
      - name: Lint
        run: supabase db lint --level warning --fail-on error
      - name: Export local API URL and publishable key
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          key=${PUBLISHABLE_KEY:-${ANON_KEY:-}}
          if [ -z "${API_URL:-}" ] || [ -z "$key" ]; then
            echo "::error::API_URL or PUBLISHABLE_KEY missing from 'supabase status -o env'"
            exit 1
          fi
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
      - name: RLS isolation and seed triggers
        run: npx tsx scripts/rls-check.ts
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
